name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-clippy-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features
      - run: cargo clippy --all-features -- -D warnings
      - run: cargo test --all-features

  node-binding:
    name: node binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx napi build --platform
      - run: cargo clippy -p serialport-stream-rs -- -D warnings
      - run: node -e "const m = require('./wrapper.js'); if (typeof m.open !== 'function') process.exit(1)"

  linux-musl:
    name: linux (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --all-features --target x86_64-unknown-linux-musl
      - run: cargo clippy --all-features --target x86_64-unknown-linux-musl -- -D warnings
      - run: cargo test --all-features --target x86_64-unknown-linux-musl
