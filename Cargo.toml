[package]
name = "serialport-stream"
version = "0.3.2"
edition = "2021"
authors = ["Erkki Silvola"]
description = "Async runtime-agnostic AsyncRead/AsyncWrite for serial ports; optional Stream support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/erkki-silvola/serialport-stream-rs"
homepage = "https://github.com/erkki-silvola/serialport-stream-rs"
keywords = ["serialport", "async", "stream", "futures"]
categories = ["asynchronous", "hardware-support"]
readme = "README.md"

[features]
default = []
stream = []
tracing = ["dep:tracing"]

[dependencies]
futures = { version = "0.3", features = ["std"] }
blocking = "1"
tracing = { version = "0.1", optional = true }

[target.'cfg(unix)'.dependencies]
async-io = "2"
nix = { version = "0.30.1", features = ["fs", "term", "ioctl", "poll"] }

[target.'cfg(windows)'.dependencies]
async-io = "2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Devices_Communication",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
futures-lite = "2.0"
clap = { version = "3.1.6", features = ["derive"] }
ctrlc = "3.5.1"
anyhow = "1.0.100"
tokio = { version = "1.41", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[example]]
name = "read_stream"
required-features = ["stream"]

[[example]]
name = "tokio_read_stream"
required-features = ["stream"]

[[example]]
name = "tokio_async_rw"
