[package]
name = "serialport-stream-rs"
version = "0.1.0"
edition = "2021"
authors = ["Erkki Silvola"]
description = "Node.js bindings for serialport-stream"
license = "MIT OR Apache-2.0"
repository = "https://github.com/erkki-silvola/serialport-stream-rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serialport-stream = { path = "..", features = ["stream"] }
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["sync", "macros", "rt"] }

[build-dependencies]
napi-build = "2"
